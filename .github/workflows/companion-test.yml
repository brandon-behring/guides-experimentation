# companion-test.yml — Phase 1 SKETCH (not active).
#
# This workflow activates when companion/ gains a pyproject.toml and tests/.
# Currently companion/ contains only a README placeholder per design doc
# v0.2 §10.6.5 (companion package = Phase 1 deliverable).
#
# To activate (Phase 1):
#   1. Add pyproject.toml + src/companion/ + tests/ under companion/
#   2. Uncomment the `jobs:` block below

name: companion-test

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-test.yml'
  pull_request:
    paths:
      - 'companion/**'

